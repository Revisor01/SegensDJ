name: Report a bug
description: Something does not work as expected.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include credentials, server
        addresses or account names; this issue is public. Report security
        issues as described in SECURITY.md.
  - type: textarea
    id: observation
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image version
      placeholder: "e.g. 0.1.0-beta"
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "e.g. Raspberry Pi 4 (8 GB), Pioneer DDJ-SB3"
